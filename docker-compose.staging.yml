services:
  stocksmart_poc_sftpgo:
    image: drakkan/sftpgo:latest
    container_name: stocksmart-poc-sftpgo
    ports:
      - 2024:2022  # SFTP port
      - 8082:8080  # Admin Web UI port
    restart: unless-stopped
    environment:
      SFTPGO_GRACE_TIME: 32
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__LOGO_PATH: /custom-folder/custom-logo.png
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__LOGO_PATH: /custom-folder/custom-logo.png
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__FAVICON_PATH: /custom-folder/favicon.png
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__FAVICON_PATH: /custom-folder/favicon.png
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__NAME: Admin (Stoksmart POC)
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__NAME: Custom Client Name
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__SHORT_NAME: Admin (POC)
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__SHORT_NAME: Custom Client Short Name

    volumes:
      - ./srv-sftpgo:/srv/sftpgo
      - ./var-lib-sftpgo:/var/lib/sftpgo
      - ./static:/usr/share/sftpgo/static/custom-folder
      - ./logs:/logs
      - /var/microservices/stoksmart-poc/local-blob-storage:/local-blob-storage
    networks:
          - testing_default  # Use the network created by the first SFTPGo instance

networks:
  testing_default:
    external: true  # Indicates this is an existing network